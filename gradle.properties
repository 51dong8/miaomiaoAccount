# JVM 参数
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true

# 显式直连：本机残留的代理设置(127.0.0.1:7897 未运行)会让 Gradle 的 HTTP 客户端全部 Connection refused
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
systemProp.http.nonProxyHosts=*
systemProp.java.net.useSystemProxies=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AGP 9.0 默认启用内置 Kotlin 与新 DSL，这里显式关闭两者，使用标准 KGP（KSP / Hilt 兼容性更稳）
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
